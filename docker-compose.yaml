x-tts-base: &tts-base
  build:
    context: https://github.com/kyutai-labs/pocket-tts.git
    dockerfile: Dockerfile
  restart: unless-stopped
  volumes:
    - ${HF_HOME_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
    - pocket_tts_cache:/root/.cache/pocket_tts
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 60s

volumes:
  pocket_tts_cache:

services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ${OLLAMA_DATA_PATH:-/default/path/.ollama}:/root/.ollama
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    deploy:
      replicas: ${OLLAMA_REPLICAS:-1}
      resources:
        limits:
          memory: 8G

  tts-pt:
    <<: *tts-base
    container_name: tts-pt
    ports:
      - "8881:8000"
    command: ["serve", "--host", "0.0.0.0", "--language", "portuguese_24l"]
    deploy:
      replicas: ${TTS_PT_REPLICAS:-1}

  tts-es:
    <<: *tts-base
    container_name: tts-es
    ports:
      - "8882:8000"
    command: ["serve", "--host", "0.0.0.0", "--language", "spanish_24l"]
    deploy:
      replicas: ${TTS_ES_REPLICAS:-1}

  tts-it:
    <<: *tts-base
    container_name: tts-it
    ports:
      - "8883:8000"
    command: ["serve", "--host", "0.0.0.0", "--language", "italian_24l"]
    deploy:
      replicas: ${TTS_IT_REPLICAS:-1}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tandem_frontend
    ports:
      - "${HOST_IP:-127.0.0.1}:5173:5173"
    # volumes:
    # - ./frontend:/app
    # - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - TTS_PT_URL=http://tts-pt:8000
      - TTS_ES_URL=http://tts-es:8000
      - TTS_IT_URL=http://tts-it:8000
      - STT_URL=http://stt:8000
    depends_on:
      ollama:
        condition: service_healthy
      tts-pt:
        condition: service_healthy
        required: false
      tts-es:
        condition: service_healthy
        required: false
      tts-it:
        condition: service_healthy
        required: false
      stt:
        condition: service_healthy
        required: false

  stt:
    build:
      context: ./stt
      dockerfile: Dockerfile
    container_name: stt
    ports:
      - "8000:8000"
    volumes:
      - ${HF_HOME_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      replicas: ${STT_REPLICAS:-1}
