services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ${OLLAMA_DATA_PATH:-/default/path/.ollama}:/root/.ollama
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    deploy:
      replicas: ${OLLAMA_REPLICAS:-1}
      resources:
        limits:
          memory: 8G

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: kokoro
    ports:
      - "8880:8880"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      replicas: ${KOKORO_REPLICAS:-1}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tandem_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - KOKORO_URL=http://kokoro:8880
      - STT_URL=http://stt:8000
    depends_on:
      ollama:
        condition: service_healthy
      kokoro:
        condition: service_healthy
        required: false
      stt:
        condition: service_healthy
        required: false

  stt:
    build:
      context: ./stt
      dockerfile: Dockerfile
    container_name: stt
    ports:
      - "8000:8000"
    volumes:
      - ${HF_HOME_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      replicas: ${STT_REPLICAS:-1}
